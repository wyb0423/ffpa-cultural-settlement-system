l_english:
 da_ffcs_establish_cultural_settlement: "Establish Cultural Settlement"
 da_ffcs_establish_cultural_settlement_desc: "Establish a contiguous settlement in a state that is a homeland of one of our primary cultures. Land settlements grow from an actual shared province border. Overseas settlements begin at the port province, cost £100,000, and provide a level 1 port when the foothold is secured. Each Colonial Affairs institution level supports two concurrent projects."
 da_ffcs_establish_cultural_settlement_action_notification_name: "[INITIATOR_COUNTRY.GetName] begins settling [TARGET_STATE.GetStateRegion.GetName]"
 da_ffcs_establish_cultural_settlement_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has begun a cultural settlement project in [TARGET_STATE.GetStateRegion.GetName]."
 FFCS_SELECT_TARGET_STATE_TT: "Choose an eligible primary-culture homeland state"
 FFCS_CULTURAL_HOMELAND_ONLY_TT: "The state must be a homeland of one of the acting country's primary cultures"
 FFCS_VALID_SETTLEMENT_ROUTE_TT: "A land route requires an actual shared province border; otherwise an overseas route requires the target owner to control the port province and the acting country to have a port"
 FFCS_NATIVE_COLONIZATION_DISABLED_TT: "Countries using Colonial Resettlement must establish colonies through Cultural Settlements"
 ffcs_cultural_settlement_project: "Cultural Settlement Project"
 ffcs_cultural_settlement_project_desc: "A foreign settlement project is gradually establishing territorial control in this state."
 notification_ffcs_settlement_foothold_name: "Settlement Foothold Established"
 notification_ffcs_settlement_foothold_desc: "Our settlers have secured their first foothold in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]."
 notification_ffcs_settlement_foothold_tooltip: "#header $notification_ffcs_settlement_foothold_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_foothold_desc$"
 notification_ffcs_settlement_setback_name: "Settlement Setback"
 notification_ffcs_settlement_setback_desc: "Resistance and local difficulties have delayed our project in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]."
 notification_ffcs_settlement_setback_tooltip: "#header $notification_ffcs_settlement_setback_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_setback_desc$"
 notification_ffcs_settlement_completed_name: "Cultural Settlement Completed"
 notification_ffcs_settlement_completed_desc: "Our settlement in [SCOPE.sStateRegion('ffcs_settlement_state_region').GetName] has completed its territorial expansion."
 notification_ffcs_settlement_completed_tooltip: "#header $notification_ffcs_settlement_completed_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_completed_desc$"
 notification_ffcs_settlement_cancelled_name: "Cultural Settlement Cancelled"
 notification_ffcs_settlement_cancelled_desc: "Our settlement project in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName] is no longer viable because of legal, territorial, or local resistance conditions and has been cancelled."
 notification_ffcs_settlement_cancelled_tooltip: "#header $notification_ffcs_settlement_cancelled_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_cancelled_desc$"
