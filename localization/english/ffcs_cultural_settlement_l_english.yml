l_english:
 law_colonial_resettlement_desc: "The Firefall shattered old states and scattered whole communities, but surviving maps, registers, and family memory still name the homelands from which they were cut off.\n\n#bold Homeland Settlement:#! Use $da_ffcs_establish_cultural_settlement$ to establish contiguous projects only in primary-culture homelands held by decentralized countries, entering across a true land border or one adjacent sea node to the target's port.\n#bold Law Effects:#! Each $institution_colonial_affairs$ level supports two concurrent projects. Overseas projects cost £100,000 and build a level 1 port. The large penalty shown under $state_colony_growth_creation_factor$ only disables the native Establish Colony command; it does not slow these projects. Company colonial charters cannot bypass this system. The #p +50%#! Migration Attraction in unincorporated states remains active."
 law_frontier_colonization_desc: "After the Firefall, a frontier is no longer a clean line but a chain of broken roads, scattered settlements, and local powers between the state and a remembered homeland.\n\n#bold Homeland Settlement:#! Use $da_ffcs_establish_cultural_settlement$ to establish contiguous projects only in primary-culture homelands held by decentralized countries, entering across a true land border or one adjacent sea node to the target's port.\n#bold Law Effects:#! Each $institution_colonial_affairs$ level supports two concurrent projects. Overseas projects cost £100,000 and build a level 1 port. The large penalty shown under $state_colony_growth_creation_factor$ only disables the native Establish Colony command; it does not slow these projects. Company colonial charters cannot bypass this system. The #p +50%#! Migration Attraction in unincorporated states remains active."
 da_ffcs_establish_cultural_settlement: "Establish Homeland Settlement"
 da_ffcs_establish_cultural_settlement_desc: "The Firefall broke the roads of old states, but not their surviving maps, family records, or memory of homeland. In a state that is a homeland of one of our primary cultures, settlers can advance contiguously from a true shared province border, or cross one adjacent sea node to secure the target owner's port. After the first foothold, each monthly settlement pulse transfers at most one connected province. Other countries may compete for the same region, but each sponsor may run only one project there. At 50 progress the sponsor gains a claim on the region. An overseas project costs £100,000 and builds a level 1 port with its first foothold. Each level of Colonial Affairs sustains two projects at once."
 da_ffcs_establish_cultural_settlement_action_notification_name: "[INITIATOR_COUNTRY.GetName] opens a homeland settlement in [TARGET_STATE.GetStateRegion.GetName]"
 da_ffcs_establish_cultural_settlement_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has sent surveyors, settlers, and supply columns into [TARGET_STATE.GetStateRegion.GetName], beginning a new homeland settlement."
 FFCS_SELECT_TARGET_STATE_TT: "Choose an eligible state that is a homeland of one of our primary cultures"
 FFCS_REQUIRES_CULTURAL_SETTLEMENT_LAW_TT: "We must use Colonial Resettlement or Frontier Colonization"
 FFCS_CULTURAL_HOMELAND_ONLY_TT: "The state must be a homeland of at least one of our primary cultures"
 FFCS_SETTLEMENT_REGION_SPONSOR_LIMIT_TT: "We may run only one Homeland Settlement project in this state region; projects sponsored by other countries do not block us"
 FFCS_VALID_SETTLEMENT_ROUTE_TT: "A land settlement requires a true shared province border. An overseas settlement requires one directly adjacent sea node, a port province held by the target owner, and a port of our own"
 FFCS_NATIVE_COLONIZATION_DISABLED_TT: "Countries using Colonial Resettlement or Frontier Colonization must pursue colonial expansion through Homeland Settlements"
 ffcs_cultural_settlement_project: "Homeland Settlement Project"
 ffcs_cultural_settlement_project_desc: "Surveyors, settler columns, and supply depots are extending the sponsor state's authority province by province along a contiguous route."
 je_ffcs_cultural_settlement_overview: "Homeland Settlements"
 je_ffcs_cultural_settlement_overview_reason: "The Firefall shattered old states, but not the memory of homeland. Surveyors, registrars, settlers, and supply columns are turning that memory into connected territory. Each active project appears below with its route, phase, progress, and monthly capacity. Select a project to open its state."
 je_ffcs_cultural_settlement_overview_status: "Survey parties and supply columns advance once each month."
 FFCS_SETTLEMENT_OVERVIEW_HEADER: "Active Homeland Settlements"
 FFCS_SETTLEMENT_PROGRESS_LABEL: "Progress"
 FFCS_SETTLEMENT_PHASE_LABEL: "Phase:"
 FFCS_SETTLEMENT_PHASE_0: "Surveying"
 FFCS_SETTLEMENT_PHASE_1: "Foothold"
 FFCS_SETTLEMENT_PHASE_2: "Settlement Belt"
 FFCS_SETTLEMENT_PHASE_3: "Consolidation"
 FFCS_SETTLEMENT_PHASE_4: "Final Transfer"
 FFCS_SETTLEMENT_ROUTE_LAND: "Land Advance"
 FFCS_SETTLEMENT_ROUTE_SEA: "Sea Crossing"
 FFCS_SETTLEMENT_MONTHLY_LABEL: "Capacity:"
 FFCS_OPEN_STATE_TOOLTIP: "Open this settlement project's state"
 notification_ffcs_settlement_foothold_name: "A Foothold in the Homeland"
 notification_ffcs_settlement_foothold_desc: "Our settlers have secured the first province in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]; survey stakes and supply depots now mark a foothold on the ground."
 notification_ffcs_settlement_foothold_tooltip: "#header $notification_ffcs_settlement_foothold_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_foothold_desc$"
 notification_ffcs_settlement_phase_2_name: "A Settlement Belt Takes Shape"
 notification_ffcs_settlement_phase_2_desc: "At 50 progress, surveyors and settlers have pushed beyond our first foothold in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]. Our government now claims the region while the measured territorial advance continues."
 notification_ffcs_settlement_phase_2_tooltip: "#header $notification_ffcs_settlement_phase_2_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_phase_2_desc$"
 notification_ffcs_settlement_phase_3_name: "Roads Become Borders"
 notification_ffcs_settlement_phase_3_desc: "At 75 progress, supply routes and boundary posts are binding our footholds in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName] into a consolidated territorial corridor."
 notification_ffcs_settlement_phase_3_tooltip: "#header $notification_ffcs_settlement_phase_3_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_phase_3_desc$"
 notification_ffcs_settlement_phase_4_name: "The Final Survey Begins"
 notification_ffcs_settlement_phase_4_desc: "At 95 progress, the territorial corridor in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName] has entered its final survey. Officials will continue recording each remaining connected transfer in turn."
 notification_ffcs_settlement_phase_4_tooltip: "#header $notification_ffcs_settlement_phase_4_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_phase_4_desc$"
 notification_ffcs_settlement_completed_name: "Homeland Settlement Complete"
 notification_ffcs_settlement_completed_desc: "All territory reached by our settlement route in [SCOPE.sStateRegion('ffcs_settlement_state_region').GetName] now answers to our administration. Fragments of homeland preserved after the Firefall in old maps and family memory have been joined by survey lines, settlements, and state authority."
 notification_ffcs_settlement_completed_tooltip: "#header $notification_ffcs_settlement_completed_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_completed_desc$"
 notification_ffcs_settlement_cancelled_name: "The Settlement Road Closes"
 notification_ffcs_settlement_cancelled_desc: "Our project in [SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName] can no longer advance: its legal mandate has lapsed, its route has broken, or competitors have taken all remaining territory from its original target. Surveyors and settlers are being recalled."
 notification_ffcs_settlement_cancelled_tooltip: "#header $notification_ffcs_settlement_cancelled_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_cancelled_desc$"
