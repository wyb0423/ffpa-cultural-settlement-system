l_simp_chinese:
 law_colonial_resettlement_desc: "大火使旧国瓦解、无数共同体流散四方，但幸存的地图、户籍与家族记忆仍标记着它们认作故土的地区。\n\n#bold 故土拓殖：#!通过$da_ffcs_establish_cultural_settlement$外交行动，可在由分权国家控制的本国主流文化故土建立连续项目；陆路必须从实际接壤地块进入，海路必须仅隔一个相邻海域抵达目标港口。研究$neoimperialism$后，拓殖授权将扩展到其他合格州地区。\n#bold 法律效果：#!$institution_colonial_affairs$制度每级提供两个并行项目；海路项目耗资£100,000，并在首个据点建立1级港口。界面中$state_colony_growth_creation_factor$一项的巨额减值只负责关闭原版“建立殖民地”命令，不会降低故土拓殖进度；公司殖民特许也不能绕过这一体系。未整合地区的移民吸引力#p +50%#!加成仍然生效。"
 law_frontier_colonization_desc: "大火后的国境不再是一条清晰界线，而是横亘于国家与故土记忆之间的断裂道路、零散聚落和地方权力。\n\n#bold 故土拓殖：#!通过$da_ffcs_establish_cultural_settlement$外交行动，可在由分权国家控制的本国主流文化故土建立连续项目；陆路必须从实际接壤地块进入，海路必须仅隔一个相邻海域抵达目标港口。研究$neoimperialism$后，拓殖授权将扩展到其他合格州地区。\n#bold 法律效果：#!$institution_colonial_affairs$制度每级提供两个并行项目；海路项目耗资£100,000，并在首个据点建立1级港口。界面中$state_colony_growth_creation_factor$一项的巨额减值只负责关闭原版“建立殖民地”命令，不会降低故土拓殖进度；公司殖民特许也不能绕过这一体系。未整合地区的移民吸引力#p +50%#!加成仍然生效。"
 da_ffcs_establish_cultural_settlement: "建立故土定居点"
 da_ffcs_establish_cultural_settlement_desc: "大火摧毁了旧国的道路，却未能抹去幸存的地图、户籍与故土记忆。最初只能选择本国主流文化故土；研究$neoimperialism$后，也可选择其他合格州地区。项目从实际接壤地块连续推进，或跨越一个相邻海域控制目标所有者的港口地块。首个据点建立后，每次月度结算最多移交一个连续地块。其他国家可以在同一地区展开竞争，但每个发起国在该地区只能维持一个计划；达到50进度时，发起国获得该地区宣称。海路计划耗资£100,000，并在首个据点建立1级港口；殖民事务制度每级可同时支撑两个计划。"
 da_ffcs_establish_cultural_settlement_action_notification_name: "[INITIATOR_COUNTRY.GetName]在[TARGET_STATE.GetStateRegion.GetName]开辟故土定居点"
 da_ffcs_establish_cultural_settlement_action_notification_desc: "[INITIATOR_COUNTRY.GetName]已向[TARGET_STATE.GetStateRegion.GetName]派出测绘队、定居者与补给纵队，一项故土拓殖计划就此开始。"
 FFCS_SELECT_TARGET_STATE_TT: "选择一个合格的主流文化故土州；研究$neoimperialism$后可选择任何合格州"
 FFCS_REQUIRES_CULTURAL_SETTLEMENT_LAW_TT: "我国必须采用殖民安置或边疆殖民法律"
 FFCS_CULTURAL_HOMELAND_ONLY_TT: "研究$neoimperialism$前，该州必须是我国至少一种主流文化的故土"
 FFCS_SETTLEMENT_REGION_SPONSOR_LIMIT_TT: "我国在同一州地区只能维持一项故土拓殖计划；其他国家发起的计划不会阻止我国加入竞争"
 FFCS_VALID_SETTLEMENT_ROUTE_TT: "陆路定居点必须从与我国实际接壤的地块开始。海路定居点必须仅跨越一个直接相邻的海域节点，目标所有者须控制港口地块，我国也须拥有港口"
 FFCS_NATIVE_COLONIZATION_DISABLED_TT: "采用殖民安置或边疆殖民法律的国家必须通过故土拓殖推进殖民扩张"
 ffcs_cultural_settlement_project: "故土拓殖计划"
 ffcs_cultural_settlement_project_desc: "测绘队、定居纵队与补给站正沿连续路线逐地块延伸发起国的统治。"
 je_ffcs_cultural_settlement_overview: "故土拓殖"
 je_ffcs_cultural_settlement_overview_reason: "大火击碎了旧国，却没有抹去人们对故土的记忆。测绘员、户籍官、定居者与补给纵队正把这份记忆重新连接成领土。下方列出每项计划的路线、阶段、进度与每月推进能力；点击项目即可打开所在州。"
 je_ffcs_cultural_settlement_overview_status: "测绘队与补给纵队每月推进一次。"
 FFCS_SETTLEMENT_OVERVIEW_HEADER: "进行中的故土拓殖"
 FFCS_SETTLEMENT_PROGRESS_LABEL: "进度"
 FFCS_SETTLEMENT_PHASE_LABEL: "阶段："
 FFCS_SETTLEMENT_PHASE_0: "勘路"
 FFCS_SETTLEMENT_PHASE_1: "立足点"
 FFCS_SETTLEMENT_PHASE_2: "定居走廊"
 FFCS_SETTLEMENT_PHASE_3: "连地巩固"
 FFCS_SETTLEMENT_PHASE_4: "最终接管"
 FFCS_SETTLEMENT_ROUTE_LAND: "陆路推进"
 FFCS_SETTLEMENT_ROUTE_SEA: "跨海航线"
 FFCS_SETTLEMENT_MONTHLY_LABEL: "推进力："
 FFCS_OPEN_STATE_TOOLTIP: "打开该定居计划所在州"
 notification_ffcs_settlement_foothold_name: "故土上的立足点"
 notification_ffcs_settlement_foothold_desc: "我国定居者已在[SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]控制首个地块；测绘桩与补给站标志着拓殖据点落地。"
 notification_ffcs_settlement_foothold_tooltip: "#header $notification_ffcs_settlement_foothold_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_foothold_desc$"
 notification_ffcs_settlement_phase_2_name: "定居走廊成形"
 notification_ffcs_settlement_phase_2_desc: "达到50进度后，我国测绘队与定居者已越过[SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]的首个据点；政府现已取得该地区宣称，逐地块推进仍在继续。"
 notification_ffcs_settlement_phase_2_tooltip: "#header $notification_ffcs_settlement_phase_2_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_phase_2_desc$"
 notification_ffcs_settlement_phase_3_name: "道路化为疆界"
 notification_ffcs_settlement_phase_3_desc: "达到75进度后，补给线与界标正把我国在[SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]的各处据点连成一片，拓殖走廊进入巩固阶段。"
 notification_ffcs_settlement_phase_3_tooltip: "#header $notification_ffcs_settlement_phase_3_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_phase_3_desc$"
 notification_ffcs_settlement_phase_4_name: "最终测绘开始"
 notification_ffcs_settlement_phase_4_desc: "达到95进度后，[SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]的拓殖走廊进入最终测绘；官员将依次登记余下每一个连续地块的移交。"
 notification_ffcs_settlement_phase_4_tooltip: "#header $notification_ffcs_settlement_phase_4_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_phase_4_desc$"
 notification_ffcs_settlement_completed_name: "故土拓殖完成"
 notification_ffcs_settlement_completed_desc: "我国在[SCOPE.sStateRegion('ffcs_settlement_state_region').GetName]沿拓殖路线取得的全部领土如今都已纳入行政；大火后散落在旧地图与家族记忆中的故土线索，终于由测绘线、定居点与国家权力重新连成一片。"
 notification_ffcs_settlement_completed_tooltip: "#header $notification_ffcs_settlement_completed_name$#!\n$TOOLTIP_DELIMITER$\n$notification_ffcs_settlement_completed_desc$"
 notification_ffcs_settlement_cancelled_name: "拓殖之路中断"
 notification_ffcs_settlement_cancelled_desc: "因法律授权失效、领土通路断裂，或竞争者已取得原目标的全部剩余领土，我国在[SCOPE.sState('ffcs_settlement_state').GetStateRegion.GetName]的计划已无法继续。测绘队与定居者正在撤回。"
